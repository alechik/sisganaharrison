# ============================================================
# NGINX - APP MOVIL (FLUTTER WEB)
# ============================================================
# Sirve la SPA compilada y reenvia /api al reverse proxy principal
# del proyecto (servicio "nginx" en la red sisganaderia_net).
# De este modo el navegador trabaja siempre en el mismo origen.
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50M;

    # ---------- API -> NGINX PRINCIPAL -> LARAVEL ----------
    location /api/ {
        proxy_pass http://nginx/api/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # ---------- ARCHIVOS ESTATICOS ----------
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|json|wasm)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    # ---------- SPA (RUTAS INTERNAS DE FLUTTER) ----------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- HEALTHCHECK ----------
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "healthy\n";
    }

    # ---------- OCULTOS ----------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}