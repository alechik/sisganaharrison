# ============================================================
# NGINX.CONF - FRONTEND REACT (SPA)
# ============================================================
# Configuración de Nginx para servir el frontend React
# compilado como archivos estáticos.
#
# Características clave:
#   - Puerto 8080 (no root-friendly)
#   - Soporte para SPA: todas las rutas caen en index.html
#   - Compresión GZIP activada para assets
#   - Cacheo agresivo para archivos hasheados (JS, CSS)
#   - Seguridad: headers de protección básicos
# ============================================================

server {
    # ---------- PUERTO DE ESCUCHA ----------
    # Usamos el puerto 8080 en lugar de 80 para no necesitar
    # privilegios de root dentro del contenedor (buena práctica).
    listen 8080;
    listen [::]:8080;
    server_name _;  # Acepta cualquier nombre de host
    server_tokens off;  # No muestra versión de Nginx en headers

    # ---------- DIRECTORIO RAÍZ ----------
    # Ruta donde se encuentran los archivos estáticos del build
    root /usr/share/nginx/html;
    index index.html;

    # ---------- CHARSET ----------
    charset utf-8;

    # ============================================================
    # CONFIGURACIÓN DE LOGS
    # ============================================================
    # Escribimos a stdout/stderr para que los capture Docker y se vean
    # con "docker logs". El contenedor corre como usuario no root, por
    # lo que no puede escribir en /var/log/nginx (fallaría al arrancar).
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # ============================================================
    # COMPRESIÓN GZIP
    # ============================================================
    # Reducimos el tamaño de los archivos transferidos ~70%
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;  # No comprimir archivos muy pequeños
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        text/csv
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        application/vnd.ms-fontobject
        application/x-font-ttf
        font/opentype
        image/svg+xml
        image/x-icon;

    # ============================================================
    # HEADERS DE SEGURIDAD
    # ============================================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ============================================================
    # CACHEO DE ASSETS CON HASH (ARCHIVOS INMUTABLES)
    # ============================================================
    # Vite genera archivos con hash en el nombre:
    #   - index-abc123.js
    #   - style-def456.css
    #   - logo-ghi789.svg
    # Estos NUNCA cambian, así que podemos cachearlos 1 año.
    location ~* \.(?:js|css|woff2?|ttf|eot|otf|png|jpg|jpeg|gif|svg|ico|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000";
        access_log off;  # No loguear peticiones de assets (mucho ruido)
        try_files $uri =404;
    }

    # ============================================================
    # ARCHIVOS HTML - SIN CACHÉ
    # ============================================================
    # Los archivos HTML pueden cambiar entre releases, así que
    # NO los cacheamos para que el usuario siempre vea la última versión.
    location ~* \.(?:html)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri =404;
    }

    # ============================================================
    # ROBOTS.TXT - CACHEO LARGO
    # ============================================================
    location = /robots.txt {
        allow all;
        log_not_found off;
        access_log off;
        expires 7d;
    }

    # ============================================================
    # FAVICON - CACHEO LARGO
    # ============================================================
    location = /favicon.ico {
        access_log off;
        log_not_found off;
        expires 30d;
    }

    # ============================================================
    # RUTA PRINCIPAL: SOPORTE PARA SPA (REACT ROUTER)
    # ============================================================
    # CUALQUIER ruta que no coincida con un archivo físico
    # se sirve index.html. Esto es necesario para que React Router
    # funcione correctamente en URLs como /animales, /lotes, etc.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ============================================================
    # DENEGAR ACCESO A ARCHIVOS OCULTOS (.env, .git, etc.)
    # ============================================================
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
