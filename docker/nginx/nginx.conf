# ============================================================
# NGINX.CONF - REVERSE PROXY PRINCIPAL
# ============================================================
# Este Nginx actúa como punto de entrada único a toda la aplicación.
# Escucha en el puerto 80 (o 443 si añades SSL) y redirige:
#
#   /api/*   → Backend Laravel (servicio "backend" por el puerto 9000)
#   /storage/*→ Backend Laravel (archivos públicos de storage)
#   /*        → Frontend React (servicio "frontend" por el puerto 8080)
#
# Ventajas de esta arquitectura:
#   ✅ Un solo puerto expuesto al exterior
#   ✅ Mismo origen (evita problemas CORS en navegador)
#   ✅ Frontend llama a /api sin necesidad de URL absoluta
#   ✅ Fácil añadir SSL/HTTPS en el futuro
# ============================================================

# ---------- EVENTOS: CONEXIONES ----------
events {
    worker_connections 1024;
}

# ---------- HTTP: CONFIGURACIÓN GLOBAL ----------
http {
    # ---------- MIME TYPES ----------
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ---------- LOGS ----------
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ---------- OPTIMIZACIONES GENERALES ----------
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_names_hash_bucket_size 64;
    client_max_body_size 50M;  # Máximo tamaño de subida (50MB)

    # ============================================================
    # UPSTREAM: BACKEND LARAVEL (PHP-FPM)
    # ============================================================
    # Nombre interno para referirnos al backend.
    # Docker DNS resuelve "backend" al contenedor del backend.
    upstream backend_php {
        server backend:9000;
    }

    # ============================================================
    # UPSTREAM: FRONTEND REACT (NGINX)
    # ============================================================
    upstream frontend_react {
        server frontend:8080;
    }

    # ============================================================
    # SERVIDOR PRINCIPAL - PUERTO 80
    # ============================================================
    server {
        listen 80;
        listen [::]:80;
        server_name _;
        server_tokens off;

        # ---------- ZONA HORARIA ----------
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;

        # ============================================================
        # RUTA /api/*  →  BACKEND LARAVEL (PHP-FPM)
        # ============================================================
        # Todas las peticiones a /api/ pasan por FastCGI directamente
        # al proceso PHP-FPM del contenedor "backend".
        # Quitamos el prefijo /api al pasárselo a Laravel.
        location /api/ {
            # Reescribimos la URL: Laravel espera /endpoint, no /api/endpoint
            # (Laravel ya define las rutas API con prefijo /api en RouteServiceProvider)
            # En realidad Laravel sí usa /api/ así que NO reescribimos nada
            include fastcgi_params;

            # Variables FastCGI requeridas por PHP
            fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_param REQUEST_URI $request_uri;
            fastcgi_param QUERY_STRING $query_string;
            fastcgi_param REQUEST_METHOD $request_method;
            fastcgi_param CONTENT_TYPE $content_type;
            fastcgi_param CONTENT_LENGTH $content_length;

            # Headers de cliente real (para que Laravel vea la IP correcta)
            fastcgi_param REMOTE_ADDR $remote_addr;
            fastcgi_param REMOTE_PORT $remote_port;
            fastcgi_param SERVER_ADDR $server_addr;
            fastcgi_param SERVER_PORT $server_port;
            fastcgi_param SERVER_NAME $server_name;

            # Headers HTTPS / esquema
            fastcgi_param HTTPS $https if_not_empty;
            fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
            fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
            fastcgi_param HTTP_X_FORWARDED_HOST $host;

            # Cabecera Authorization (Bearer token de Sanctum).
            # fastcgi_params NO la reenvía por defecto, sin esto todas
            # las rutas protegidas responderían 401 Unauthorized.
            fastcgi_param HTTP_AUTHORIZATION $http_authorization;
            fastcgi_param HTTP_ACCEPT $http_accept;
            fastcgi_param HTTP_X_REQUESTED_WITH $http_x_requested_with;
            fastcgi_param REDIRECT_STATUS 200;

            # Timeouts largos para procesos que tardan (ej: generación de PDFs)
            fastcgi_read_timeout 300;
            fastcgi_send_timeout 300;
            fastcgi_connect_timeout 60;

            # Buffer para respuestas grandes
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;

            # Pasamos al upstream PHP-FPM
            fastcgi_pass backend_php;
        }

        # ============================================================
        # RUTA /storage/*  →  ARCHIVOS PÚBLICOS DE LARAVEL
        # ============================================================
        # Si usas "php artisan storage:link", los archivos públicos
        # del storage están en /storage/. Los servimos con X-Accel-Redirect
        # o sirviéndolos desde el storage del backend.
        location /storage/ {
            internal;  # No accesible desde el exterior directamente
            alias /var/www/html/storage/app/public/;
        }

        # ============================================================
        # RUTA /  →  FRONTEND REACT
        # ============================================================
        # Cualquier otra petición (incluyendo rutas SPA como /animales)
        # la enviamos al Nginx del frontend, que a su vez sabe
        # redirigir a index.html cuando no encuentra el archivo.
        location / {
            proxy_pass http://frontend_react;

            # Headers para que el frontend vea el cliente real
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Buffers
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
        }

        # ============================================================
        # HEALTHCHECK DOCKER
        # ============================================================
        location = /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "healthy\n";
        }

        # ============================================================
        # DENEGAR ACCESO A ARCHIVOS OCULTOS
        # ============================================================
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
